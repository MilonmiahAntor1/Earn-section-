<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Buttons</title>

<style>
  body {
    background: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .box {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 280px;
  }

  a {
    text-decoration: none;
  }

  .btn {
    padding: 15px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.25s ease;
  }

  .btn img {
    width: 18px;
    height: 18px;
  }

  /* Live Chat – unchanged */
  .live {
    background: #6f42c1;
  }

  /* Support – Purple */
  .support {
    background: #8e44ad; /* purple */
  }

  .btn:hover {
    transform: scale(1.04);
    filter: brightness(1.08);
  }
</style>
</head>

<body>

<div class="box">

  <a href="https://t.me/TakaIncomeCommunity" target="_blank">
    <div class="btn live">
      <img src="https://telegram.org/img/t_logo.svg" alt="Telegram">
      Live Chat
    </div>
  </a>

  <a href="https://t.me/TakaIncomeofficialchat" target="_blank">
    <div class="btn support">
      <img src="https://telegram.org/img/t_logo.svg" alt="Telegram">
      Support on Telegram
    </div>
  </a>

</div>

</body>
</html>
