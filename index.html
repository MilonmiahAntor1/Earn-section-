<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gift Drop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #0e0e0e;
  font-family: Arial, sans-serif;
  color: #fff;
}

.container {
  display: flex;
  gap: 14px;
  padding: 16px;
}

.card {
  flex: 1;
  background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
  border-radius: 18px;
  padding: 16px;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

.tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(255,255,255,0.08);
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 12px;
  color: #aaa;
}

.star-3d {
  text-align: center;
  margin-top: 28px;
  font-size: 64px;
  text-shadow:
    0 2px 0 #d4af37,
    0 4px 0 #b8962e,
    0 6px 0 #8f6f1e,
    0 10px 15px rgba(255,215,0,0.5);
}

@keyframes happyGlow {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.bday-3d {
  text-align: center;
  margin-top: 30px;
  font-size: 26px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff4ecd, #ffb347, #4dd2ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: happyGlow 1.4s infinite;
}

.title {
  margin-top: 18px;
  font-size: 22px;
  font-weight: bold;
}

.sub {
  font-size: 14px;
  color: #aaa;
}

.btn {
  margin-top: 14px;
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.star-btn {
  background: linear-gradient(90deg, #ffd700, #ffb700);
  color: #000;
}

.gift-btn {
  background: linear-gradient(90deg, #ff4ecd, #ff8a00);
  color: #fff;
}

.btn:active {
  transform: scale(0.96);
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="tag">TG Stars</div>
    <div class="star-3d">⭐</div>
    <div class="title">Stars</div>
    <div class="sub">Send 100 Telegram Stars</div>
    <button class="btn star-btn" onclick="send100Stars()">Send 100 ⭐</button>
  </div>

  <div class="card">
    <div class="tag">TG Gifts</div>
    <div class="bday-3d">🎂 Happy<br>Birthday</div>
    <div class="title">Gifts</div>
    <div class="sub">Premium Gift</div>
    <button class="btn gift-btn" onclick="sendGift()">Send a Gift</button>
  </div>

</div>

<script>
Telegram.WebApp.ready();

function send100Stars() {
  Telegram.WebApp.openTelegramLink("https://t.me/Realtakaincamebot");
}

function sendGift() {
  Telegram.WebApp.openTelegramLink("https://t.me/TakaInncomeSupport");
}
</script>

</body>
</html>
