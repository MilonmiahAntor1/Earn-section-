<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasks UI</title>

<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #000;
  }

  .container {
    max-width: 420px;
    margin: auto;
    padding: 28px 20px;
  }

  .title {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .subtitle2 {
    font-size: 26px;
    margin-bottom: 28px;
  }

  /* Segmented buttons */
  .segment {
    background: #f0f0f0;
    border-radius: 40px;
    padding: 6px;
    display: flex;
    gap: 6px;
    margin-bottom: 25px;
  }

  .seg-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #333;
    padding: 15px 0;
    font-size: 17px;
    font-weight: 800;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.25s;
  }

  .seg-btn.active {
    background: linear-gradient(135deg, #ff5fd2, #8b5cf6);
    color: #fff;
    font-weight: 900;
  }

  /* 🟣 TASK CARD WITH ROTATING PURPLE BORDER */
  .task-card {
    position: relative;
    display: none;
    margin-bottom: 16px;
    border-radius: 22px;
    overflow: hidden;
  }

  .task-card.show {
    display: block;
  }

  /* rotating border */
  .task-card::before {
    content: "";
    position: absolute;
    inset: -2px;
    background: conic-gradient(
      #8b5cf6,
      #a855f7,
      #d946ef,
      #8b5cf6
    );
    animation: rotateBorder 3s linear infinite;
    border-radius: 24px;
    z-index: 0;
  }

  /* inner white box */
  .task-card::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: #ffffff;
    border-radius: 18px;
    z-index: 1;
  }

  @keyframes rotateBorder {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* content */
  .task-content {
    position: relative;
    z-index: 2;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .task-left {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .task-badge {
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 8px;
  }

  .task-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .task-reward {
    font-size: 14px;
    color: #555;
    font-weight: 600;
  }

  /* Watch Ad Button */
  .start-btn {
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
    transition: transform 0.25s ease;
  }

  .start-btn:hover {
    transform: translateY(-2px);
  }

  .start-btn:active {
    transform: scale(0.96);
  }
</style>
</head>

<body>

<div class="container">

  <div class="title">TASKS</div>
  <div class="subtitle">GET REWARDS FOR</div>
  <div class="subtitle2">COMPLETING QUESTS.</div>

  <div class="segment">
    <button class="seg-btn active" data-tab="ingame">In-game</button>
    <button class="seg-btn" data-tab="partners">Partners</button>
    <button class="seg-btn" data-tab="limited">Limited</button>
  </div>

  <!-- TASK CARD -->
  <div class="task-card show" id="taskCard">
    <div class="task-content">
      <div class="task-left">
        <div class="task-badge">Ad</div>
        <div>
          <div class="task-title">View ads & click</div>
          <div class="task-reward">+0.30</div>
        </div>
      </div>
      <button class="start-btn">Watch Ad</button>
    </div>
  </div>

</div>

<script>
  const buttons = document.querySelectorAll('.seg-btn');
  const taskCard = document.getElementById('taskCard');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (btn.dataset.tab === 'limited') {
        taskCard.classList.remove('show');
      } else {
        taskCard.classList.add('show');
      }
    });
  });
</script>

</body>
</html>
