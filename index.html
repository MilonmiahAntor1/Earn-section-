<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasks UI</title>

<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #000;
  }

  .container {
    max-width: 420px;
    margin: auto;
    padding: 28px 20px;
  }

  /* Title */
  .title {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .subtitle span {
    color: #000;
  }

  .subtitle2 {
    font-size: 26px;
    color: #000;
    margin-bottom: 28px;
  }

  /* Segmented control */
  .segment {
    background: #f0f0f0;
    border-radius: 40px;
    padding: 6px;
    display: flex;
    gap: 6px;
  }

  .seg-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #555;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600; /* ✅ thicker text */
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  /* Active button */
  .seg-btn.active {
    background: linear-gradient(135deg, #ff5fd2, #8b5cf6);
    color: #fff;
    font-weight: 700; /* ✅ extra bold when active */
    box-shadow:
      0 0 12px rgba(255, 95, 210, 0.8),
      0 0 28px rgba(139, 92, 246, 0.7),
      0 0 45px rgba(139, 92, 246, 0.6);
  }

  .seg-btn:focus {
    outline: none;
  }
</style>
</head>

<body>

<div class="container">

  <div class="title">TASKS</div>

  <div class="subtitle">
    GET REWARDS <span>FOR</span>
  </div>

  <div class="subtitle2">
    COMPLETING QUESTS.
  </div>

  <!-- Segmented Buttons -->
  <div class="segment">
    <button class="seg-btn active">In-game</button>
    <button class="seg-btn">Partners</button>
    <button class="seg-btn">Limited</button>
  </div>

</div>

<script>
  const buttons = document.querySelectorAll('.seg-btn');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>

</body>
</html>
